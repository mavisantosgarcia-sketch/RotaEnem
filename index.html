<body>
<title>Rota ENEM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: navegação lateral no desktop, faixa de abas rolável no celular; conteúdo em cartões sobre off white esverdeado. Verde musgo é o único acento; cada área do ENEM tem a sua cor de dado. */
:root{
  --bg:#F3F4EC; --surface:#FAFAF6; --surface-2:#EAEDDF; --ink:#1E2819; --ink-2:#44503C; --muted:#636E59; --line:#D6DAC8;
  --moss:#4E6334; --moss-strong:#36461F; --moss-soft:#DDE5CC; --on-moss:#F7F8F0;
  --warn:#8A5F0F; --warn-soft:#F0E5C4; --bad:#9A3F2A; --bad-soft:#F1DAD1;
  --c-lin:#788C32; --c-hum:#A97628; --c-nat:#2B7A71; --c-mat:#9E4B34; --c-red:#58698F;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141912; --surface:#1B2118; --surface-2:#252C20; --ink:#E7EBDC; --ink-2:#BBC3AC; --muted:#949D86; --line:#2D3527;
    --moss:#93AE6B; --moss-strong:#B3CB8F; --moss-soft:#2A3622; --on-moss:#121710;
    --warn:#E0B65A; --warn-soft:#3A3219; --bad:#E39A84; --bad-soft:#3F231C;
    --c-lin:#A9BE6A; --c-hum:#DBA751; --c-nat:#5BB8AB; --c-mat:#E0856B; --c-red:#93A9D3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141912; --surface:#1B2118; --surface-2:#252C20; --ink:#E7EBDC; --ink-2:#BBC3AC; --muted:#949D86; --line:#2D3527;
  --moss:#93AE6B; --moss-strong:#B3CB8F; --moss-soft:#2A3622; --on-moss:#121710;
  --warn:#E0B65A; --warn-soft:#3A3219; --bad:#E39A84; --bad-soft:#3F231C;
  --c-lin:#A9BE6A; --c-hum:#DBA751; --c-nat:#5BB8AB; --c-mat:#E0856B; --c-red:#93A9D3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,5vw,36px)} h2{font-size:21px} h3{font-size:17px} h4{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--moss-strong)}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:0 36px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:14px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;text-decoration:none;color:var(--ink)}
.logo svg{width:30px;height:30px;flex:none}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;gap:6px;overflow-x:auto;padding:12px 0 12px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14px;border:1px solid transparent}
.nav a svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--moss);color:var(--on-moss)}
.sync{display:none;font-size:12.5px;color:var(--muted);padding:10px 14px}
main{padding-top:8px;min-width:0;display:grid;gap:20px;align-content:start}
@media(min-width:900px){
  .shell{grid-template-columns:220px minmax(0,1fr);align-items:start}
  .top{align-self:start;padding-top:28px}
  .nav{flex-direction:column;overflow:visible;padding:20px 0}
  .nav a{border-radius:10px}
  .sync{display:block}
  main{padding-top:28px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.card.soft{background:var(--surface-2);border-color:transparent}
.card.moss{background:var(--moss);color:var(--on-moss);border-color:var(--moss)}
.card.moss .muted,.card.moss .eyebrow{color:inherit;opacity:.78}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head{display:grid;gap:6px;margin-bottom:2px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--moss);border-color:var(--moss);color:var(--on-moss)}
.btn.primary:hover{background:var(--moss-strong);border-color:var(--moss-strong)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
input,select,textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:40px}
textarea{resize:vertical;min-height:72px}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--moss)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:500;border:1px solid transparent;color:var(--ink-2)}
button.chip{cursor:pointer;font:inherit;font-size:13px;font-weight:500;padding:7px 13px}
button.chip[aria-pressed="true"]{background:var(--moss);color:var(--on-moss)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.good{background:var(--moss-soft);color:var(--moss-strong)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--moss);border-radius:99px}
.card.moss .meter{background:rgba(255,255,255,.2)} .card.moss .meter>i{background:var(--on-moss)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;font-size:14px;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--moss)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;display:grid;gap:10px;justify-items:center}
.list{display:grid}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.stat{display:grid;gap:2px;padding:14px;border-radius:12px;background:var(--surface-2)}
.stat b{font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.note{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.note.info{background:var(--moss-soft);color:var(--moss-strong)}

.clock{font:500 clamp(64px,18vw,104px)/1 var(--f-mono);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em;padding:18px 0 8px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.day{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:8px;align-content:start}
.day.now{border-color:var(--moss);box-shadow:0 0 0 1px var(--moss)}
.day.past{opacity:.62}
.blk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.blk .t{font-weight:600;font-size:14px;overflow-wrap:anywhere} .blk .s{font-size:12.5px;color:var(--muted)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px}
.bar .v{text-align:right;font-family:var(--f-mono);font-size:12.5px}
.vbars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;align-items:end;height:150px}
.vbars div{display:grid;gap:4px;justify-items:center;align-content:end;height:100%;font-size:11.5px;color:var(--muted)}
.vbars i{display:block;width:100%;max-width:44px;background:var(--moss);border-radius:6px 6px 0 0;min-height:2px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lab{fill:var(--ink);font-weight:500}
.quote{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.thumbs figure{margin:0;display:grid;gap:6px;min-width:0}
.thumbbtn{border:0;padding:0;background:none;cursor:pointer;display:block;width:100%}
.zoomimg{width:100%;max-height:70vh;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
label.btn{position:relative;cursor:pointer}
label.btn.off{opacity:.5;pointer-events:none}
label.btn:focus-within{outline:2px solid var(--moss);outline-offset:2px}
.filein{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;padding:0;cursor:pointer}
textarea.essay{min-height:300px;line-height:1.65;font-size:15px}
.scroll-x{overflow-x:auto}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-size:20px;color:var(--muted);line-height:1}
details[open]>summary::after{content:"−"}
.status{font-size:12px;font-weight:600;border-radius:999px;padding:4px 11px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.status.s1{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.status.s2{background:var(--moss-soft);color:var(--moss-strong);border-color:transparent}
@media(max-width:520px){.bar{grid-template-columns:78px minmax(0,1fr) 70px}.card{padding:16px}}
@media(prefers-reduced-motion:no-preference){.meter>i,.bar .track i{transition:width .4s ease}}
</style>

<div class="shell">
  <div class="top">
    <div class="brand">
      <a class="logo" href="#hoje" aria-label="Rota ENEM, início">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--moss)"/><path d="M8 22c3-9 8-12 16-12-1 8-5 13-13 13M8 22c3-3 6-5 10-7" stroke="var(--on-moss)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Rota ENEM</span>
      </a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Alternar tema claro e escuro">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <div class="sync" id="sync"></div>
  </div>
  <main id="app"></main>
</div>

<script>

 hum:["Brasil Colônia","Brasil Império","República Velha e Era Vargas","Ditadura militar e redemocratização","Idade Média e Moderna","Revoluções Industrial e Francesa","Guerras Mundiais e Guerra Fria","Cartografia","Clima, relevo e vegetação","Urbanização","Geopolítica e globalização","Questões ambientais","Agropecuária e indústria","Filosofia antiga e política","Sociologia: cultura e desigualdade","Cidadania e direitos humanos","Trabalho e capitalismo"],

};

var EIXOS=["Saúde","Educação","Tecnologia e ciência","Meio ambiente","Direitos e cidadania","Trabalho e economia","Cultura e identidade","Cidades e desigualdades"];
var THEMES_RAW=[{"e":"Saúde","t":"Os impactos do excesso de telas na saúde de crianças e adolescentes no Brasil","x":["Celulares, tablets e jogos fazem parte da rotina de muitas crianças desde cedo. Há famílias que usam a tela para entreter os filhos enquanto trabalham, e escolas que já discutem limites ao uso dentro e fora da sala de aula.","Profissionais de saúde alertam que o uso intenso de telas pode atrapalhar o sono, a atenção e as brincadeiras ao ar livre. Ao mesmo tempo, a tecnologia também ajuda a aprender e a manter amizades, o que torna o debate mais complexo do que proibir ou liberar."],"p":["Responsabilidade de famílias, escolas e empresas de tecnologia","Efeitos no sono, na atenção e na convivência","Educação digital como alternativa à simples proibição"],"r":["Estatuto da Criança e do Adolescente (Lei 8.069/1990) e a proteção integral","Constituição Federal, art. 227: prioridade absoluta à criança e ao adolescente","Zygmunt Bauman e a vida conectada em “Modernidade líquida”"]},{"e":"Educação","t":"Caminhos para reduzir a evasão escolar no ensino médio brasileiro","x":["Muitos jovens deixam a escola antes de concluir o ensino médio. Entre os motivos que costumam aparecer estão a necessidade de trabalhar, a distância entre o conteúdo e a vida real e a falta de apoio para quem fica para trás.","Programas de ensino integral, auxílio financeiro e busca ativa de estudantes faltosos são algumas das respostas já testadas por redes de ensino. O desafio é fazer com que essas ações cheguem de forma contínua a quem mais precisa."],"p":["Relação entre trabalho precoce e abandono escolar","Currículo e sentido do estudo para o jovem","Papel do Estado, da escola e da família"],"r":["Constituição Federal, art. 205: educação como direito de todos e dever do Estado e da família","Plano Nacional de Educação (Lei 13.005/2014)","Paulo Freire, “Pedagogia da Autonomia”"]},{"e":"Tecnologia e ciência","t":"Desafios para o uso ético da inteligência artificial na sociedade brasileira","x":["Sistemas de inteligência artificial já ajudam a indicar filmes, filtrar currículos e produzir textos e imagens. À medida que passam a decidir coisas que afetam a vida das pessoas, cresce a pergunta sobre quem responde quando algo dá errado.","Especialistas apontam riscos como o viés em decisões automáticas, a criação de conteúdo falso e o uso de dados pessoais sem consentimento. Ao mesmo tempo, a tecnologia abre caminhos na saúde, na educação e na pesquisa científica."],"p":["Responsabilidade de empresas e do poder público","Proteção de dados e transparência","Educação para o uso crítico da tecnologia"],"r":["Lei Geral de Proteção de Dados (Lei 13.709/2018)","Marco Civil da Internet (Lei 12.965/2014)","Hans Jonas, “O princípio responsabilidade”, sobre ética na era tecnológica"]},{"e":"Meio ambiente","t":"Desafios para enfrentar os impactos das mudanças climáticas nas cidades brasileiras","x":["Chuvas fortes, enchentes, ondas de calor e secas atingem cidades de diferentes regiões do país. Os efeitos costumam ser mais graves onde há moradias em áreas de risco e pouca infraestrutura de drenagem.","Adaptar as cidades envolve mais áreas verdes, planejamento do uso do solo e sistemas de alerta. Debates internacionais, como o Acordo de Paris, cobram metas de redução de emissões, mas as decisões também precisam chegar ao nível local."],"p":["Desigualdade: quem sofre mais com os desastres","Planejamento urbano e prevenção","Cooperação entre governos, empresas e população"],"r":["Constituição Federal, art. 225: meio ambiente ecologicamente equilibrado","Acordo de Paris (2015)","Estatuto da Cidade (Lei 10.257/2001)"]},{"e":"Direitos e cidadania","t":"Desafios para garantir o acesso à moradia digna no Brasil","x":["Morar bem vai além de ter um teto. Inclui água tratada, esgoto, energia, transporte por perto e segurança contra deslizamentos e enchentes. Em muitas cidades brasileiras, parte da população vive em locais sem essas condições.","Programas habitacionais, regularização de terrenos e aluguel social são algumas das políticas discutidas. Ao mesmo tempo, imóveis vazios em áreas centrais alimentam o debate sobre a função social da propriedade."],"p":["Moradia como direito social, e não só como mercadoria","Regularização fundiária e infraestrutura","Função social da propriedade"],"r":["Constituição Federal, art. 6º: moradia entre os direitos sociais","Estatuto da Cidade (Lei 10.257/2001)","Carolina Maria de Jesus, “Quarto de despejo”"]},{"e":"Trabalho e economia","t":"Os efeitos do trabalho por aplicativos sobre os direitos dos trabalhadores no Brasil","x":["Entregadores e motoristas de aplicativo escolhem seus horários, mas dependem das regras e dos valores definidos pelas plataformas. Muitos trabalham longas jornadas sem férias, sem seguro e sem garantia de renda mínima.","Há quem defenda a liberdade e a flexibilidade desse modelo, e quem defenda o reconhecimento de direitos trabalhistas. O debate envolve empresas, trabalhadores, sindicatos e o poder público."],"p":["Flexibilidade versus proteção social","Papel do Estado na regulamentação","Futuro do trabalho na era digital"],"r":["Consolidação das Leis do Trabalho (CLT)","Charles Chaplin, “Tempos modernos” (1936)","Ricardo Antunes, “O privilégio da servidão”"]},{"e":"Cultura e identidade","t":"Desafios para a preservação do patrimônio cultural brasileiro","x":["Igrejas históricas, museus, saberes de comunidades e festas populares formam o patrimônio cultural do país. Parte desse patrimônio sofre com falta de manutenção, de recursos e de conhecimento por parte da própria população.","O incêndio que atingiu o Museu Nacional, em 2018, tornou-se exemplo do que se perde quando a conservação fica em segundo plano. Também existe patrimônio que não é feito de pedra: modos de fazer, línguas e tradições."],"p":["Patrimônio material e imaterial","Responsabilidade do poder público e da sociedade","Educação patrimonial nas escolas"],"r":["Constituição Federal, art. 216, sobre o patrimônio cultural brasileiro","IPHAN, órgão federal de proteção ao patrimônio","Incêndio do Museu Nacional (2018)"]},{"e":"Cidades e desigualdades","t":"Desafios da mobilidade urbana e do transporte público nas cidades brasileiras","x":["Quem mora longe do trabalho pode gastar horas por dia em ônibus, trens e metrôs lotados. Esse tempo perdido pesa mais para quem tem renda menor e vive nas periferias.","Faixas exclusivas de ônibus, ciclovias e integração entre tarifas são medidas adotadas em várias cidades. Elas disputam espaço e orçamento com o transporte por carro, que ainda recebe grande parte dos investimentos."],"p":["Relação entre moradia, emprego e deslocamento","Prioridade ao transporte coletivo","Impactos ambientais e na qualidade de vida"],"r":["Política Nacional de Mobilidade Urbana (Lei 12.587/2012)","Constituição Federal, art. 6º: transporte entre os direitos sociais (Emenda 90/2015)","Milton Santos, geógrafo, sobre cidadania e território"]},{"e":"Saúde","t":"Desafios para ampliar a vacinação e combater a desinformação em saúde no Brasil","x":["O Brasil construiu ao longo de décadas um programa de vacinação reconhecido, o Programa Nacional de Imunizações. Mesmo assim, boatos e informações falsas nas redes sociais ajudam a espalhar dúvidas sobre a segurança das vacinas.","A Revolta da Vacina, em 1904, mostra que a resistência a campanhas de saúde não é nova. Hoje, o desafio inclui explicar com clareza como a ciência funciona e garantir que os serviços de saúde cheguem a todas as regiões."],"p":["Papel da escola e da mídia na informação confiável","Acesso aos serviços de saúde em todas as regiões","Responsabilidade das plataformas digitais"],"r":["Programa Nacional de Imunizações (PNI)","Revolta da Vacina (1904)","Constituição Federal, art. 196: saúde como direito de todos"]},{"e":"Educação","t":"O papel da escola no combate ao bullying e à violência entre adolescentes no Brasil","x":["Humilhações, apelidos e agressões físicas ou virtuais ainda fazem parte do cotidiano de muitos estudantes. Quem sofre pode perder o interesse pelos estudos, isolar-se e ter prejuízos na saúde emocional.","Há leis que obrigam as escolas a prevenir e combater a intimidação sistemática, mas a aplicação depende de professores preparados, da participação das famílias e de canais seguros para denúncia."],"p":["Formação de professores e acolhimento","Cyberbullying e redes sociais","Participação das famílias e dos estudantes"],"r":["Lei 13.185/2015, que institui o Programa de Combate à Intimidação Sistemática","Constituição Federal, art. 227","Estatuto da Criança e do Adolescente (Lei 8.069/1990)"]},{"e":"Tecnologia e ciência","t":"Caminhos para combater golpes digitais e proteger a população brasileira na internet","x":["Mensagens falsas de bancos, links enganosos e perfis clonados são formas comuns de golpe. Idosos e pessoas com pouca familiaridade com tecnologia estão entre os alvos mais frequentes, mas ninguém está totalmente protegido.","A prevenção passa por bancos e plataformas com sistemas de segurança, por leis que punam os criminosos e por campanhas que ensinem a desconfiar de ofertas e pedidos urgentes."],"p":["Educação digital em diferentes idades","Responsabilidade de bancos, operadoras e plataformas","Punição e prevenção dos crimes virtuais"],"r":["Lei 12.737/2012, sobre crimes informáticos","Lei Geral de Proteção de Dados (Lei 13.709/2018)","Marco Civil da Internet (Lei 12.965/2014)"]},{"e":"Meio ambiente","t":"Caminhos para a preservação dos biomas brasileiros diante do desmatamento e das queimadas","x":["Amazônia, Cerrado, Pantanal, Caatinga, Mata Atlântica e Pampa abrigam enorme diversidade de plantas e animais e ajudam a regular o clima e a água. O desmatamento e as queimadas ameaçam esse equilíbrio.","Fiscalização, incentivo à produção sustentável e valorização das comunidades que vivem da floresta aparecem entre as saídas apontadas. A realização da COP30 em Belém, em 2025, colocou a Amazônia no centro do debate mundial."],"p":["Fiscalização e punição de crimes ambientais","Alternativas econômicas sustentáveis","Papel das comunidades tradicionais"],"r":["Constituição Federal, art. 225","Código Florestal (Lei 12.651/2012)","COP30, realizada em Belém (2025)"]},{"e":"Direitos e cidadania","t":"Caminhos para combater o trabalho análogo ao de escravo no Brasil","x":["Mais de um século depois da abolição, o país ainda encontra pessoas submetidas a jornadas exaustivas, dívidas impagáveis e condições degradantes. A situação aparece no campo e nas cidades, em setores como agropecuária, construção e confecção.","O Código Penal define o crime, e fiscais do trabalho resgatam trabalhadores a cada ano. Ainda assim, a pobreza, a falta de oportunidades e a dificuldade de denunciar mantêm muitas pessoas vulneráveis."],"p":["Pobreza e vulnerabilidade como porta de entrada","Fiscalização e punição de quem explora","Responsabilidade das empresas ao longo da cadeia produtiva"],"r":["Lei Áurea (1888)","Código Penal, art. 149, sobre redução a condição análoga à de escravo","Cadastro de empregadores flagrados com trabalho escravo, divulgado pelo governo federal"]},{"e":"Trabalho e economia","t":"Desafios para a inserção do jovem no mercado de trabalho no Brasil","x":["Para conseguir o primeiro emprego, muitos jovens ouvem que precisam de experiência, mas como ter experiência sem ser contratado? Esse impasse atinge principalmente quem vive em regiões com poucas vagas ou saiu cedo da escola.","Programas de aprendizagem profissional, estágios e cursos técnicos funcionam como ponte entre a escola e o trabalho. O desafio é ampliar essas oportunidades sem prejudicar os estudos."],"p":["Qualificação e acesso a cursos técnicos","Aprendizagem e estágio como porta de entrada","Equilíbrio entre trabalho e estudos"],"r":["Lei da Aprendizagem (Lei 10.097/2000)","Estatuto da Juventude (Lei 12.852/2013)","Constituição Federal, art. 7º, que fixa idade mínima para o trabalho"]},{"e":"Cultura e identidade","t":"Desafios para democratizar o acesso à leitura e aos livros no Brasil","x":["Livros costumam custar caro, e muitas cidades têm poucas livrarias e bibliotecas. Mesmo onde há acesso, nem sempre há estímulo para que as pessoas leiam por prazer.","Bibliotecas comunitárias, clubes de leitura e programas de distribuição de livros ajudam a formar leitores. Pesquisas sobre o hábito de leitura do brasileiro, como a “Retratos da Leitura no Brasil”, orientam políticas públicas."],"p":["Escola e família na formação de leitores","Bibliotecas públicas e comunitárias","Livros digitais e novas formas de leitura"],"r":["Paulo Freire, “A importância do ato de ler”","Plano Nacional do Livro e Leitura (PNLL)","Pesquisa “Retratos da Leitura no Brasil”"]},{"e":"Cidades e desigualdades","t":"Caminhos para enfrentar a insegurança alimentar e o desperdício de alimentos no Brasil","x":["O país é grande produtor de alimentos, mas famílias ainda passam dias sem refeições adequadas. Ao mesmo tempo, grande quantidade de comida é perdida na colheita, no transporte e dentro das casas.","O médico e escritor Josué de Castro mostrou, em “Geografia da Fome”, que a fome tem causas sociais e políticas, e não apenas naturais. Hoje, a segurança alimentar é tratada como direito, ao lado da educação e da saúde."],"p":["Fome como problema social e político","Combate ao desperdício na cadeia de produção","Programas de alimentação escolar e de renda"],"r":["Josué de Castro, “Geografia da Fome”","Constituição Federal, art. 6º: alimentação entre os direitos sociais (Emenda 64/2010)","Lei de Segurança Alimentar e Nutricional (Lei 11.346/2006)"]},{"e":"Saúde","t":"Desafios para o acesso à saúde pública em regiões distantes dos grandes centros no Brasil","x":["O Sistema Único de Saúde garante atendimento a todos, mas quem vive em áreas rurais, ribeirinhas ou longe dos grandes centros muitas vezes precisa viajar horas para consultas e exames. Barcos-hospital, equipes itinerantes e a telemedicina são caminhos usados para diminuir essa distância.","Faltam profissionais dispostos a se fixar em locais afastados, e a internet instável dificulta o atendimento a distância. Quando a doença é descoberta tarde, o tratamento costuma ser mais difícil e mais caro."],"p":["Distribuição de médicos e equipes pelo território","Telemedicina e infraestrutura de internet","Atenção básica e prevenção"],"r":["Constituição Federal, art. 196 e art. 198 (SUS)","Lei Orgânica da Saúde (Lei 8.080/1990)","Programa Mais Médicos (Lei 12.871/2013)"]},{"e":"Saúde","t":"Os riscos da automedicação e do uso indiscriminado de antibióticos no Brasil","x":["Tomar remédio por conta própria, seguindo a dica de um conhecido ou de um site, é comum e parece inofensivo. Mas medicamentos podem esconder sintomas, causar reações e interagir mal com outros remédios.","O uso de antibióticos sem necessidade ou fora da dose correta contribui para que bactérias se tornem resistentes, o que dificulta o tratamento de infecções comuns. Por isso, esses remédios só devem ser usados com orientação de um profissional de saúde."],"p":["Papel de médicos e farmacêuticos na orientação","Propaganda de medicamentos e facilidade de acesso","Resistência bacteriana como problema coletivo"],"r":["Anvisa, agência que regula os medicamentos no país","Lei 5.991/1973, sobre o comércio de medicamentos","Alexander Fleming e a descoberta da penicilina (1928)"]},{"e":"Saúde","t":"A importância da doação de órgãos e os desafios para ampliá-la no Brasil","x":["Muitas pessoas aguardam um transplante, e para várias delas a doação é a única chance de continuar vivendo ou de ter melhor qualidade de vida. No Brasil, os transplantes são feitos por um sistema público que atende pelo SUS.","A doação de órgãos de pessoas falecidas depende da autorização da família. Por isso, conversar com os parentes sobre essa vontade em vida faz diferença, e campanhas de conscientização ajudam a derrubar medos e dúvidas."],"p":["Conversa em família e consentimento","Combate a mitos e à desinformação","Estrutura para captação e transporte de órgãos"],"r":["Lei dos Transplantes (Lei 9.434/1997)","Sistema Nacional de Transplantes","Setembro Verde, campanha de incentivo à doação"]},{"e":"Saúde","t":"Desafios para prevenir a obesidade infantil e incentivar a alimentação saudável no Brasil","x":["Alimentos ultraprocessados, como salgadinhos, refrigerantes e biscoitos recheados, são práticos, baratos e muito anunciados. Em muitas casas e escolas, eles ocupam o lugar de frutas, verduras e comida preparada na hora.","O excesso de peso na infância pode trazer problemas de saúde que continuam na vida adulta. Alimentação escolar saudável, regras para a propaganda dirigida a crianças e incentivo à atividade física fazem parte do debate."],"p":["Alimentação escolar e educação nutricional","Publicidade de alimentos dirigida a crianças","Preço e acesso a alimentos saudáveis"],"r":["Guia Alimentar para a População Brasileira (Ministério da Saúde)","Programa Nacional de Alimentação Escolar (Lei 11.947/2009)","Constituição Federal, art. 227"]},{"e":"Saúde","t":"O papel da atividade física e do esporte na promoção da saúde da população brasileira","x":["Praticar atividade física regularmente ajuda o coração, os ossos, o humor e o sono, mas parte da população passa o dia sentada, no trabalho, na escola ou diante de telas.","Praças, quadras e projetos esportivos gratuitos facilitam o acesso, mas não existem em todos os bairros. A educação física escolar também tem papel central em criar o hábito de se movimentar."],"p":["Espaços públicos e projetos esportivos gratuitos","Educação física na escola","Efeitos na saúde física e emocional"],"r":["Constituição Federal, art. 217, sobre o dever do Estado de fomentar práticas esportivas","Lei Geral do Esporte (Lei 14.597/2023)","Orientações da Organização Mundial da Saúde sobre atividade física"]},{"e":"Saúde","t":"Desafios para ampliar o cuidado com a saúde mental de estudantes no Brasil","x":["Provas, cobrança por resultado, comparação nas redes sociais e incerteza sobre o futuro pesam sobre muitos estudantes. Cansaço, irritação e dificuldade para dormir podem aparecer em épocas de mais pressão.","Escolas e universidades têm ampliado rodas de conversa e o apoio de psicólogos, mas nem sempre há profissionais suficientes. Reconhecer sinais de sofrimento e procurar ajuda cedo está entre as orientações de especialistas."],"p":["Papel da escola e da família no acolhimento","Pressão por desempenho e comparação","Acesso a atendimento psicológico"],"r":["Lei da Reforma Psiquiátrica (Lei 10.216/2001)","Lei 13.935/2019, sobre psicólogos e assistentes sociais na educação básica","Setembro Amarelo, campanha de valorização da vida"]},{"e":"Educação","t":"Desafios para a inclusão de estudantes com deficiência nas escolas brasileiras","x":["Estudantes com deficiência têm direito de frequentar a escola comum, com apoio para aprender. Isso pode envolver rampas, materiais adaptados, intérpretes de Libras e professores de apoio.","Na prática, muitas escolas ainda enfrentam falta de estrutura e de formação de professores. A convivência entre estudantes diferentes também ensina respeito e cooperação a toda a turma."],"p":["Formação de professores e recursos de acessibilidade","Convivência e combate ao preconceito","Responsabilidade do Estado e das escolas"],"r":["Lei Brasileira de Inclusão (Lei 13.146/2015)","Constituição Federal, art. 208, III, sobre o atendimento educacional especializado","Convenção sobre os Direitos das Pessoas com Deficiência (ONU, 2006)"]},{"e":"Educação","t":"A importância da educação financeira na formação dos jovens brasileiros","x":["Muitos jovens começam a lidar com dinheiro cedo, seja com mesada, primeiro emprego ou compras pela internet. Mesmo assim, noções de orçamento, juros e poupança nem sempre aparecem na escola.","A educação financeira ajuda a planejar gastos, evitar dívidas e entender o custo de comprar a prazo. O tema aparece em documentos educacionais como a BNCC, mas a forma de ensiná-lo varia entre as escolas."],"p":["Escola, família e mídia como educadoras","Consumo consciente e endividamento","Poupança e planejamento a longo prazo"],"r":["Base Nacional Comum Curricular (BNCC)","Estratégia Nacional de Educação Financeira (Decreto 7.397/2010)","Lei do Superendividamento (Lei 14.181/2021)"]},{"e":"Educação","t":"Desafios para a valorização da carreira do professor no Brasil","x":["O professor é peça central do ensino, mas muitos profissionais relatam salários baixos, turmas cheias, jornada pesada e pouco reconhecimento. Isso desestimula jovens a escolher a carreira.","Formação inicial e continuada, plano de carreira, boas condições de trabalho e respeito da comunidade aparecem como caminhos. O debate envolve governos, escolas, famílias e a própria sociedade."],"p":["Remuneração e condições de trabalho","Formação inicial e continuada","Reconhecimento social da profissão"],"r":["Lei do Piso Salarial do Magistério (Lei 11.738/2008)","Constituição Federal, art. 206, V, sobre a valorização dos profissionais da educação","Paulo Freire, “Pedagogia da Autonomia”"]},{"e":"Educação","t":"Desafios para garantir a alfabetização de crianças na idade certa no Brasil","x":["Aprender a ler e a escrever nos primeiros anos do ensino fundamental é a base para aprender todas as outras matérias. Quando a criança chega ao fim do 2º ano sem ler com autonomia, o atraso tende a crescer nas séries seguintes.","A pandemia de covid-19 afastou crianças da sala de aula e aumentou a preocupação com esse atraso. Redes de ensino têm investido em formação de professores, materiais e acompanhamento, como no Compromisso Nacional Criança Alfabetizada."],"p":["Formação de professores e material didático","Participação da família na leitura","Desigualdades entre redes de ensino e regiões"],"r":["Plano Nacional de Educação (Lei 13.005/2014)","Compromisso Nacional Criança Alfabetizada","Magda Soares, “Alfabetização e letramento”"]},{"e":"Educação","t":"Desafios para ampliar o acesso e a permanência no ensino superior no Brasil","x":["Entrar na universidade é um passo importante para muitos jovens, mas o acesso ainda depende de renda, da qualidade da escola e do local de moradia. O ENEM e o SISU ampliaram a possibilidade de concorrer a vagas em todo o país.","A Lei de Cotas reserva parte das vagas das instituições federais a estudantes de escolas públicas, com recortes de renda e étnico-raciais. Além de entrar, o desafio é permanecer: moradia, alimentação e transporte pesam no orçamento dos estudantes."],"p":["Políticas de acesso e de permanência","Qualidade da educação básica pública","Papel das universidades na redução de desigualdades"],"r":["Lei de Cotas (Lei 12.711/2012)","Constituição Federal, art. 206, I, sobre igualdade de condições para acesso e permanência","Programa Nacional de Assistência Estudantil (Decreto 7.234/2010)"]},{"e":"Educação","t":"O papel da escola no combate à desinformação entre os jovens brasileiros","x":["Boatos, montagens e notícias falsas circulam em grupos de mensagens e redes sociais com muita rapidez. Muitos jovens se informam principalmente pelo celular, onde nem sempre fica claro quem produziu um conteúdo.","A educação midiática ensina a checar a fonte, comparar versões e perceber quando um texto tenta provocar emoção em vez de informar. A escola pode incluir esse aprendizado em todas as disciplinas."],"p":["Leitura crítica e checagem de fontes","Papel da escola, da família e das plataformas","Consequências da desinformação para a saúde e a convivência"],"r":["Marco Civil da Internet (Lei 12.965/2014)","Agências de checagem de fatos","BNCC, competência de cultura digital"]},{"e":"Tecnologia e ciência","t":"Os efeitos das redes sociais na imagem corporal e na autoestima dos jovens brasileiros","x":["Fotos editadas, filtros e rotinas aparentemente perfeitas fazem parte do dia a dia das redes. Ao se comparar com esses padrões, muitos jovens passam a se sentir insatisfeitos com o próprio corpo.","Influenciadores podem inspirar hábitos saudáveis, mas também divulgar dietas e padrões irreais. Especialistas defendem diálogo em casa e na escola e mais cuidado das plataformas com o conteúdo que recomendam."],"p":["Padrões de beleza e comparação social","Responsabilidade de influenciadores e plataformas","Diálogo em família e na escola"],"r":["Estatuto da Criança e do Adolescente (Lei 8.069/1990)","Guy Debord, “A sociedade do espetáculo”","Zygmunt Bauman, “Modernidade líquida”"]},{"e":"Tecnologia e ciência","t":"Desafios para a inclusão digital da população brasileira","x":["Estudar, procurar emprego, acessar serviços públicos e até marcar consultas médicas dependem cada vez mais da internet. Mas nem todos têm um aparelho adequado, plano de dados ou conexão estável.","Falta também preparo para usar os recursos com segurança e autonomia, principalmente entre idosos e moradores de áreas isoladas. Políticas de conectividade nas escolas e em espaços públicos fazem parte da discussão."],"p":["Acesso à infraestrutura e a equipamentos","Capacitação para o uso das ferramentas","Exclusão digital e desigualdade social"],"r":["Marco Civil da Internet (Lei 12.965/2014)","Manuel Castells, “A sociedade em rede”","Pesquisa TIC Domicílios, do Cetic.br"]},{"e":"Tecnologia e ciência","t":"Os desafios do descarte do lixo eletrônico no Brasil","x":["Celulares, computadores, carregadores e pilhas são trocados com frequência, em parte porque novos modelos surgem o tempo todo. Quando vão para o lixo comum, esses aparelhos podem liberar substâncias que contaminam o solo e a água.","O lixo eletrônico também guarda metais que podem ser reaproveitados. A logística reversa obriga fabricantes e vendedores a participar do recolhimento, mas muitas pessoas não sabem onde levar os aparelhos velhos."],"p":["Responsabilidade de empresas e consumidores","Consumo e obsolescência programada","Pontos de coleta e educação ambiental"],"r":["Política Nacional de Resíduos Sólidos (Lei 12.305/2010)","Logística reversa","Constituição Federal, art. 225"]},{"e":"Tecnologia e ciência","t":"Os limites do uso de reconhecimento facial e da vigilância por câmeras no Brasil","x":["Câmeras com reconhecimento facial já são usadas em estádios, aeroportos, prédios e na segurança pública. A tecnologia promete agilizar a identificação de pessoas e ajudar a localizar suspeitos e desaparecidos.","Críticos alertam para o risco de erros, de vigilância excessiva e de uso de imagens sem consentimento. O debate é como equilibrar segurança, privacidade e transparência sobre quem guarda esses dados."],"p":["Segurança pública e privacidade","Risco de erros e de discriminação","Transparência e fiscalização"],"r":["Lei Geral de Proteção de Dados (Lei 13.709/2018)","Constituição Federal, art. 5º, X, sobre a intimidade e a vida privada","George Orwell, “1984”"]},{"e":"Tecnologia e ciência","t":"A expansão das apostas on-line e seus riscos para os jovens brasileiros","x":["Jogos eletrônicos e plataformas de apostas estão a um clique no celular, muitas vezes divulgados por influenciadores e anúncios nas redes sociais. A maioridade é exigida para apostar, mas o controle nem sempre funciona.","Especialistas alertam para o risco de vício, de endividamento e de perda de dinheiro, mesmo entre quem aposta pouco. A discussão envolve regulamentação, fiscalização da publicidade e apoio a quem perde o controle."],"p":["Publicidade e influenciadores","Regulamentação e fiscalização","Endividamento e saúde mental"],"r":["Lei 14.790/2023, que regula as apostas de quota fixa","Estatuto da Criança e do Adolescente (Lei 8.069/1990)","Lei do Superendividamento (Lei 14.181/2021)"]},{"e":"Tecnologia e ciência","t":"Desafios para a valorização da ciência e da divulgação científica no Brasil","x":["Vacinas, GPS e medicamentos chegam à vida das pessoas depois de anos de pesquisa. Ainda assim, parte da população desconhece como a ciência trabalha ou desconfia de seus resultados.","Grande parte da pesquisa feita no país acontece em universidades públicas, e cortes de recursos e baixa divulgação preocupam cientistas. Museus de ciência, canais de divulgação e a escola ajudam a aproximar o público desse conhecimento."],"p":["Escola e mídia na divulgação científica","Investimento em pesquisa e inovação","Combate ao negacionismo"],"r":["Carl Sagan, “O mundo assombrado pelos demônios”","Semana Nacional de Ciência e Tecnologia","Constituição Federal, art. 218, sobre o incentivo à ciência"]},{"e":"Meio ambiente","t":"Desafios para a gestão do lixo e a ampliação da reciclagem no Brasil","x":["Todos os dias as cidades brasileiras produzem muito lixo, e parte dele ainda acaba em lixões a céu aberto, onde contamina o solo e a água. A coleta seletiva existe em muitos municípios, mas nem sempre funciona bem.","Catadores de materiais recicláveis fazem parte importante dessa cadeia, muitas vezes em condições precárias. Reduzir o consumo, reaproveitar e reciclar são passos defendidos por especialistas."],"p":["Responsabilidade de governos, empresas e consumidores","Papel dos catadores e das cooperativas","Redução do consumo e do desperdício"],"r":["Política Nacional de Resíduos Sólidos (Lei 12.305/2010)","Constituição Federal, art. 225","Os 3 Rs da sustentabilidade: reduzir, reutilizar e reciclar"]},{"e":"Meio ambiente","t":"Desafios para garantir o acesso à água tratada e ao saneamento básico no Brasil","x":["Ter água tratada e esgoto coletado é condição básica de saúde, porque reduz doenças como diarreias e verminoses. Ainda assim, muitas famílias brasileiras vivem sem um desses serviços ou sem os dois.","O Marco Legal do Saneamento, de 2020, estabeleceu metas para ampliar os serviços e abriu espaço para investimento privado. Há debate sobre como garantir preços justos e atender também as regiões mais pobres."],"p":["Saneamento e saúde pública","Investimento público e privado","Desigualdades regionais"],"r":["Marco Legal do Saneamento (Lei 14.026/2020)","Constituição Federal, art. 196 e art. 225","Dia Mundial da Água, comemorado em 22 de março"]},{"e":"Meio ambiente","t":"Os impactos da poluição por plástico nos rios e nos oceanos","x":["Sacolas, garrafas e embalagens descartadas de forma incorreta chegam aos rios e ao mar, onde levam muitos anos para se degradar. Animais marinhos podem ingerir esse material ou ficar presos nele.","Pedaços cada vez menores, chamados de microplásticos, já foram encontrados em diversos ambientes. Reduzir embalagens, trocar descartáveis e melhorar a coleta de lixo aparecem entre as propostas."],"p":["Redução de plásticos descartáveis","Coleta e reciclagem de resíduos","Consumo consciente"],"r":["Política Nacional de Resíduos Sólidos (Lei 12.305/2010)","ODS 14 da ONU, vida na água","Constituição Federal, art. 225"]},{"e":"Meio ambiente","t":"O papel da energia limpa na transição energética do Brasil","x":["O Brasil produz boa parte da sua eletricidade em usinas hidrelétricas e tem ampliado a energia solar e a eólica. Fontes renováveis emitem menos gases do efeito estufa do que o carvão e o petróleo.","Ao mesmo tempo, grandes obras podem afetar comunidades e ecossistemas, e a mudança do modelo exige investimento e planejamento. A transição energética é debatida como forma de combater o aquecimento global sem frear o desenvolvimento."],"p":["Fontes renováveis e impactos locais","Políticas públicas e incentivos","Acesso à energia pela população"],"r":["Acordo de Paris (2015)","ODS 7 da ONU, energia limpa e acessível","Constituição Federal, art. 225"]},{"e":"Meio ambiente","t":"Os efeitos do consumismo e da moda de descarte rápido sobre o meio ambiente","x":["Roupas, eletrônicos e acessórios são trocados cada vez mais rápido, incentivados por promoções e tendências que mudam toda semana. Produzir tudo isso gasta água, energia e matéria-prima.","Brechós, conserto, troca e compra planejada ajudam a diminuir o descarte. Também há debate sobre a responsabilidade das empresas, que precisam rever o modo de produzir e de anunciar."],"p":["Consumismo e publicidade","Reutilização e economia circular","Responsabilidade das empresas"],"r":["Zygmunt Bauman, “Vida para consumo”","Código de Defesa do Consumidor (Lei 8.078/1990)","Constituição Federal, art. 170, VI, sobre a defesa do meio ambiente na ordem econômica"]},{"e":"Meio ambiente","t":"Caminhos para combater o tráfico de animais silvestres no Brasil","x":["Aves, répteis e macacos retirados da natureza são vendidos como animais de estimação ou para colecionadores. Muitos morrem durante o transporte, e a retirada prejudica o equilíbrio do ambiente onde viviam.","A Lei de Crimes Ambientais prevê punição para quem captura ou comercializa animais silvestres sem autorização. Fiscalização, denúncias e educação ambiental são medidas citadas para reduzir a procura por esses animais."],"p":["Fiscalização e punição","Educação e conscientização do consumidor","Biodiversidade e equilíbrio ecológico"],"r":["Lei de Crimes Ambientais (Lei 9.605/1998)","Constituição Federal, art. 225, § 1º, VII, sobre a proteção da fauna","Convenção sobre Diversidade Biológica (Rio-92)"]},{"e":"Direitos e cidadania","t":"Desafios para ampliar a participação dos jovens na vida política e comunitária do Brasil","x":["Aos 16 anos o voto é facultativo, e muitos jovens decidem se vão ou não tirar o título de eleitor. Debates apontam que parte deles se afasta da política tradicional, mas participa de grêmios, coletivos e causas.","Conhecer direitos, acompanhar o que acontece na cidade e participar de conselhos e consultas públicas são formas de cidadania que vão além do voto. A escola pode ensinar como funcionam as instituições e como cobrar resultados."],"p":["Educação para a cidadania","Participação além do voto","Papel dos grêmios e dos conselhos"],"r":["Constituição Federal, art. 14, sobre o voto facultativo aos maiores de 16 e menores de 18 anos","Estatuto da Juventude (Lei 12.852/2013)","Hannah Arendt, “A condição humana”"]},{"e":"Direitos e cidadania","t":"Desafios para garantir os direitos das pessoas em situação de rua no Brasil","x":["Pessoas em situação de rua vivem em calçadas, praças e viadutos, expostas ao frio, à fome e à violência. As causas se misturam: perda de emprego, rompimento de laços familiares, dependência de substâncias e falta de moradia acessível.","Centros de acolhida e equipes de abordagem são algumas das respostas. Especialistas apontam que o atendimento funciona melhor quando reúne moradia, saúde, trabalho e documentos."],"p":["Moradia e políticas integradas","Combate ao preconceito","Acesso a saúde, documentos e trabalho"],"r":["Política Nacional para a População em Situação de Rua (Decreto 7.053/2009)","Constituição Federal, art. 1º, III, sobre a dignidade da pessoa humana, e art. 6º","Declaração Universal dos Direitos Humanos (1948)"]},{"e":"Direitos e cidadania","t":"Caminhos para o enfrentamento do racismo estrutural no Brasil","x":["O racismo aparece em ofensas, mas também em desigualdades de acesso a emprego, renda, moradia e segurança. Quando está presente nas regras, nos hábitos e nas instituições, costuma ser chamado de racismo estrutural.","A injúria racial passou a ser tratada como racismo pela lei, com pena maior. Políticas de cotas, educação antirracista e valorização da história e da cultura afro-brasileira fazem parte do debate."],"p":["Racismo estrutural e desigualdades","Educação antirracista","Punição e prevenção"],"r":["Lei 7.716/1989, que define os crimes de racismo, e Lei 14.532/2023","Constituição Federal, art. 5º, XLII, que torna o racismo crime inafiançável e imprescritível","Silvio Almeida, “Racismo estrutural”"]},{"e":"Direitos e cidadania","t":"Desafios para garantir a acessibilidade de pessoas com deficiência nos espaços públicos","x":["Calçadas esburacadas, ônibus sem elevador, prédios sem rampa e sites sem recursos de leitura dificultam a vida de pessoas com deficiência ou com mobilidade reduzida. Esses obstáculos reduzem a autonomia e limitam o acesso à escola, ao trabalho e ao lazer.","A acessibilidade beneficia também idosos, gestantes e pessoas com carrinho de bebê. Fiscalizar o cumprimento das normas e planejar as cidades pensando em todos são caminhos apontados."],"p":["Acessibilidade física e digital","Fiscalização do cumprimento da lei","Conscientização da sociedade"],"r":["Lei Brasileira de Inclusão (Lei 13.146/2015)","Lei 10.098/2000, sobre normas de acessibilidade","Convenção sobre os Direitos das Pessoas com Deficiência (ONU, 2006)"]},{"e":"Direitos e cidadania","t":"Caminhos para a ressocialização e a redução da superlotação no sistema prisional brasileiro","x":["Muitas unidades prisionais brasileiras têm mais presos do que vagas, com celas lotadas e pouca assistência. A pena de prisão deveria punir, mas também preparar a pessoa para voltar à sociedade.","Estudo e trabalho dentro das unidades podem reduzir o tempo de pena e ajudar na ressocialização, mas nem todos têm acesso a eles. A dificuldade de conseguir emprego depois da saída aumenta o risco de reincidência."],"p":["Ressocialização por estudo e trabalho","Superlotação e condições dignas","Preconceito contra egressos"],"r":["Lei de Execução Penal (Lei 7.210/1984)","Constituição Federal, art. 5º, XLIX, que assegura aos presos o respeito à integridade física e moral","Michel Foucault, “Vigiar e punir”"]},{"e":"Direitos e cidadania","t":"Desafios para ampliar o acesso à justiça e à informação sobre direitos no Brasil","x":["Conhecer os próprios direitos é o primeiro passo para exigi-los, mas muitas pessoas não sabem a quem recorrer quando são lesadas, como em conflitos de consumo, de trabalho ou de moradia.","A Defensoria Pública oferece orientação jurídica gratuita a quem não pode pagar um advogado, mas ainda não chega a todas as cidades. Educação em direitos e linguagem mais simples nos órgãos públicos aparecem como alternativas."],"p":["Educação jurídica e cidadania","Defensoria Pública e serviços gratuitos","Linguagem acessível na justiça"],"r":["Constituição Federal, art. 5º, XXXV e LXXIV, e art. 134, sobre a Defensoria Pública","Código de Defesa do Consumidor (Lei 8.078/1990)","Declaração Universal dos Direitos Humanos (1948)"]},{"e":"Trabalho e economia","t":"Os desafios do trabalho informal no Brasil","x":["Camelôs, diaristas, vendedores ambulantes e muitos prestadores de serviço trabalham sem carteira assinada. Eles costumam ter renda instável e ficam sem direitos como férias, 13º salário e licença em caso de doença.","A informalidade pode ser uma saída para quem não encontra emprego formal, mas deixa o trabalhador desprotegido na velhice e em acidentes. Qualificação, crédito e formalização, como o MEI, buscam reduzir o problema."],"p":["Proteção social e previdência","Qualificação e geração de emprego","Formalização de pequenos negócios"],"r":["Consolidação das Leis do Trabalho (CLT)","Constituição Federal, art. 7º, sobre os direitos dos trabalhadores","Lei Complementar 128/2008, que criou o Microempreendedor Individual"]},{"e":"Trabalho e economia","t":"Os efeitos do endividamento das famílias e do consumo por impulso no Brasil","x":["Cartão de crédito, parcelamentos e compras por aplicativo facilitam o consumo, mas também podem levar a dívidas difíceis de pagar. Anúncios que estimulam a compra por impulso agravam o problema.","A Lei do Superendividamento criou regras para proteger o consumidor e permitir a renegociação de dívidas. Especialistas defendem também educação financeira desde cedo e mais clareza nas informações sobre juros."],"p":["Educação financeira","Responsabilidade das instituições financeiras","Publicidade e consumo por impulso"],"r":["Lei do Superendividamento (Lei 14.181/2021)","Código de Defesa do Consumidor (Lei 8.078/1990)","Zygmunt Bauman, “Vida para consumo”"]},{"e":"Trabalho e economia","t":"Desafios para garantir a igualdade salarial entre homens e mulheres no Brasil","x":["Mulheres e homens podem exercer a mesma função e, ainda assim, receber valores diferentes. A diferença também aparece nos cargos de chefia, onde as mulheres continuam menos presentes.","A Lei de Igualdade Salarial obriga empresas maiores a divulgar relatórios de transparência salarial. O debate envolve fiscalização, divisão do trabalho doméstico e combate a preconceitos na contratação."],"p":["Transparência e fiscalização","Divisão do trabalho doméstico e de cuidado","Preconceito no mercado de trabalho"],"r":["Lei de Igualdade Salarial (Lei 14.611/2023)","Constituição Federal, art. 5º, I, e art. 7º, XXX","Simone de Beauvoir, “O segundo sexo”"]},{"e":"Trabalho e economia","t":"Os desafios do trabalho remoto para a qualidade de vida dos brasileiros","x":["Com a internet, muitas funções passaram a ser feitas de casa ou de qualquer lugar. O trabalho remoto reduz o tempo no trânsito e dá mais flexibilidade, mas pode misturar o espaço de descanso com o de trabalho.","O direito de se desconectar fora do horário de trabalho e o cuidado com a saúde mental aparecem como temas centrais. Também há dúvidas sobre quem paga os custos de internet e de equipamentos."],"p":["Direito à desconexão","Saúde física e emocional","Responsabilidades de empresas e empregados"],"r":["Consolidação das Leis do Trabalho, artigos sobre teletrabalho (Lei 13.467/2017)","Constituição Federal, art. 7º","Byung-Chul Han, “Sociedade do cansaço”"]},{"e":"Trabalho e economia","t":"Desafios para fortalecer o empreendedorismo e os pequenos negócios no Brasil","x":["Muitos brasileiros abrem o próprio negócio por vontade de empreender, e outros por falta de emprego. Pequenas empresas geram trabalho e renda em muitas cidades, mas enfrentam burocracia, impostos e dificuldade de crédito.","O MEI simplificou a formalização de pequenos negócios, com contribuição reduzida e acesso a benefícios previdenciários. O desafio é ajudar esses empreendedores a crescer e a se manter, com orientação e qualificação."],"p":["Burocracia e crédito","Formalização e proteção social","Orientação e qualificação do empreendedor"],"r":["Estatuto da Micro e Pequena Empresa (Lei Complementar 123/2006)","Lei Complementar 128/2008, que criou o MEI","Sebrae, instituição de apoio aos pequenos negócios"]},{"e":"Trabalho e economia","t":"Os impactos da automação sobre o emprego no Brasil","x":["Máquinas e programas já realizam tarefas antes feitas por pessoas, como atendimento em caixas, linhas de produção e análise de dados. Isso pode aumentar a eficiência, mas também extingue funções e exige novas habilidades.","Ao mesmo tempo, surgem profissões novas ligadas à tecnologia. Especialistas defendem qualificação contínua, políticas de transição e debate sobre quem deve arcar com os custos da mudança."],"p":["Qualificação e educação ao longo da vida","Papel do Estado e das empresas","Criação de novas ocupações"],"r":["Revolução Industrial e o movimento ludista","Constituição Federal, art. 7º, XXVII, que prevê proteção em face da automação","Charles Chaplin, “Tempos modernos” (1936)"]},{"e":"Cultura e identidade","t":"A importância das festas e manifestações da cultura popular para a identidade brasileira","x":["Festas juninas, carnaval, congadas, bumba meu boi e outras celebrações mantêm vivas tradições transmitidas por gerações. Elas reúnem comunidades, geram renda e fortalecem o sentimento de pertencimento.","Muitas dessas manifestações dependem de apoio financeiro e de reconhecimento para continuar. Ao mesmo tempo, o turismo e a comercialização levantam o debate sobre como preservar o sentido original da festa."],"p":["Patrimônio imaterial e identidade","Apoio público e financiamento","Turismo e mercantilização"],"r":["Constituição Federal, art. 215 e art. 216","Decreto 3.551/2000, que criou o registro de bens culturais de natureza imaterial","Câmara Cascudo, estudioso do folclore brasileiro"]},{"e":"Cultura e identidade","t":"Os efeitos da internet na linguagem e na escrita dos jovens brasileiros","x":["Abreviações, memes, emojis e gírias de internet fazem parte da forma como os jovens se comunicam. Há quem veja nisso um empobrecimento da escrita e istas","Descentralização da produção cultural"],"r":["Lei Rouanet (Lei 8.313/1991)","Lei Aldir Blanc (Lei 14.017/2020)","Constituição Federal, art. 215"]},{"e":"Cultura e identidade","t":"A importância da história e da memória local na formação dos estudantes brasileiros","x":["Cada cidade guarda histórias de pessoas, lugares e acontecimentos que não aparecem nos livros didáticos. Praças, ruas e prédios antigos contam essa memória, mas muitos acabam esquecidos ou demolidos.","Visitas a museus locais, projetos com idosos que contam o passado do bairro e pesquisas em arquivos ajudam os estudantes a se reconhecerem como parte da história. O desafio é integrar esse conteúdo ao currículo escolar."],"p":["Memória e identidade","Escola e história local","Preservação de documentos e espaços"],"r":["Constituição Federal, art. 216","IPHAN, órgão de proteção do patrimônio","Jacques Le Goff, “História e memória”"]},{"e":"Cultura e identidade","t":"O esporte como instrumento de inclusão e de identidade cultural no Brasil","x":["O futebol, o vôlei, a capoeira e outras práticas fazem parte da cultura brasileira e unem pessoas de diferentes origens. Projetos esportivos em comunidades oferecem atividade e convivência a crianças e jovens.","O esporte também mostra problemas, como violência entre torcidas, preconceito contra atletas e falta de investimento em modalidades menos populares. Garantir o acesso ao esporte faz parte do debate sobre cidadania."],"p":["Esporte como inclusão e educação","Violência e preconceito no esporte","Investimento público e privado"],"r":["Constituição Federal, art. 217","Lei Geral do Esporte (Lei 14.597/2023)","Roda de capoeira, reconhecida como patrimônio cultural"]},{"e":"Cidades e desigualdades","t":"O desafio de reduzir a desigualdade de renda no Brasil","x":["Mesmo sendo uma das maiores economias do mundo, o Brasil tem grande diferença entre a renda dos mais ricos e a dos mais pobres. Essa distância afeta o acesso à educação, à saúde e à moradia."," function planStrips(W,H){
 var sh=Math.round(W/2.2);
 if(H<=sh*1.15)return [{y:0,h:H}];
 var step,n;
 for(var k=0;k<20;k++){step=Math.round(sh*0.8);n=Math.ceil((H-sh)/step)+1;if(n<=7)break;sh=Math.round(sh*1.15);}
 n=Math.max(1,n);var out=[];
 for(var i=0;i<n;i++){var h=Math.min(sh,H),y=Math.max(0,Math.min(i*step,H-h));out.push({y:y,h:h});}
 return out;
}

   var cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,s.y,W,s.h,0,0,cv.width,cv.height);

  function prog(m){c.prog=m;var el=$("#corProg");if(el)el.textContent=m;}
  (async function(){
   try{
    var sample=await getSample();if(!sample)throw {code:"not_declared"};
    var strips=[];
    for(var f=0;f<c.files.length;f++){try{strips=strips.concat(await sliceImage(c.files[f]));}catch(e){strips.push(c.files[f]);}}
    var groups=[];for(var i=0;i<strips.length;i+=G)groups.push(strips.slice(i,i+G));
    for(var g=0;g<groups.length;g++){
     if(ctl.signal.aborted)throw {code:"cancelled"};
     prog("Lendo parte "+(g+1)+" de "+groups.length+"…");
     var raw=await sample.json(readPrompt({theme:th.t,tail:g?tailOf(lines):""}),{images:groups[g],signal:ctl.signal,modelTier:tier});
     var part=normRead(raw);
     lines=lines.concat(g?dedupeStart(lines,part.lines):part.lines);
     legs.push(part.leg);duv=duv.concat(part.duv);if(part.obs&&!obs)obs=part.obs;
     c.text=joinLines(lines);c.info=mk();
     if(g<groups.length-1)render();
    }
    if(!lines.length)throw {code:"empty_completion"};
    c.reading=false;c.prog="";c.info=mk();render();
   }catch(e){
    c.reading=false;c.prog="";var code=e&&e.code;
    if(lines.length){c.text=joinLines(lines);c.info=mk();c.partial=true;c.err=code==="cancelled"?"Leitura interrompida. O que já foi lido está abaixo.":"A leitura parou antes do fim. "+(COR_ERR[code]||COR_ERR.upstream_error)+" O que já foi lido está abaixo. Leia a foto de novo para pegar o texto inteiro.";}
    else c.err=code==="cancelled"?"":(COR_ERR[code]||COR_ERR.upstream_error);
    render();
   }
  })();
 },
 corRerun:function(){
  var c=ui.cor;if(c.busy||!c.res)return;
  c.rr={prev:c.res,note:c.rev};act.corRun();
 },
 corExtCopy:function(el){
  var c=ui.cor,th=corTheme(),text=String(c.text||"").trim(),re=el&&el.dataset&&el.dataset.v==="re";
  if(!th.t){c.err="Escolha ou escreva um tema.";render();return;}
  if(!re&&c.mode==="photo"&&!c.ok){c.err="Marque que você conferiu o texto lido antes de corrigir.";render();return;}
  if(wc(text)<30){c.err="Escreva o texto antes de corrigir. São necessárias pelo menos 30 palavras.";render();return;}
  var rr=re&&c.res?{prev:c.res,note:c.rev}:null;
  c.err="";c.extRr=rr;c.extP=corPrompt(th,text.slice(0,9000),rr?revExtra(rr):"");c.extMsg="Preparando…";render();
  copyTxt(c.extP,function(okc){c.extMsg=okc?"Pedido copiado.":"Não consegui copiar sozinho. Selecione o texto abaixo e copie.";render();});
 },
 corExtReadCopy:function(){var c=ui.cor;copyTxt(extReadPrompt(corTheme().t||"tema livre"),function(okc){c.extMsg2=okc?"Pedido de leitura copiado. Agora abra o Claude, anexe a foto e cole o pedido.":"Não consegui copiar sozinho.";render();});},
 corExtImport:function(){
  var c=ui.cor,th=corTheme(),text=String(c.text||"").trim();
  try{var res=normRes(parseExt(c.extIn));}catch(e){c.err="Não consegui entender a resposta. Cole a resposta inteira do Claude, do primeiro { ao último }.";render();return;}
  var rr=c.extRr;c.extIn="";c.extP="";c.extRr=null;c.extMsg="";c.err="";applyRes(res,th,text,rr);
 },
 corStop:function(){if(ui.cor.ctl)ui.cor.ctl.abort();},
 corView:function(el){var x=S.cor.filter(function(k){return k.i===el.dataset.id;})[0];if(!x)return;ui.cor.mode="type";ui.cor.info=null;ui.cor.src="free";ui.cor.free=x.t;ui.cor.text=x.text;ui.cor.res=x.res;ui.cor.rev="";ui.cor.err="";render();},
 corSave:function(){
  var r=ui.cor.res;if(!r||r.saved||r.an)return;
  var x=S.cor.filter(function(k){return k.res===r;})[0],cs=r.comp.map(function(k){return k.nota;}),old=r.essId?S.ess.filter(function(k){return k.i===r.essId;})[0]:null;
  if(old){old.c=cs;old.nt="Correção por IA (estimativa), refeita";}
  else{var id=uid();S.ess.push({i:id,d:today(),t:x?x.t:corTheme().t,c:cs,nt:"Correção por IA (estimativa)"});r.essId=id;}
  r.saved=true;commit();
 },
 corRun:function(){
  var c=ui.cor;if(c.busy)return;
  var th=corTheme(),text=String(c.text||"").trim();
  if(!th.t){c.err="Escolha ou escreva um tema.";render();return;}
  if(c.mode==="photo"&&!c.ok){c.err="Marque que você conferiu o texto lido antes de corrigir.";render();return;}
  if(wc(text)<30){c.err="Escreva o texto antes de corrigir. São necessárias pelo menos 30 palavras.";render();return;}
  var rr=c.rr;c.rr=null;
  c.err="";c.busy=true;c.res=null;
  var ctl=new AbortController();c.ctl=ctl;render();
  getSample().then(function(sample){
   if(!sample)throw {code:"not_declared"};
   return sample.json(corPrompt(th,text.slice(0,9000),rr?revExtra(rr):""),{signal:ctl.signal,modelTier:"default"});
  }).then(function(raw){
   applyRes(normRes(raw),th,text,rr);
  }).catch(function(e){
   c.busy=false;var code=e&&e.code;c.err=code==="cancelled"?"":(COR_ERR[code]||COR_ERR.upstream_error);render();
  });
 }
};
var chg={
 tType:function(el){T.type=el.value;},
 ckSleep:function(el){var v=num(el.value,0,14),t=today(),c=S.chk.filter(function(x){return x.d===t;})[0];if(!c){c={d:t};S.chk.push(c);}c.sleep=v;S.chk=S.chk.slice(-120);commit();},
 dayH:function(el){var v=num(el.value,0,10);if(v==null)v=0;S.set.dayH[+el.dataset.i]=v;commit();},
 weight:function(el){var v=num(el.value,0.5,2);S.set.w[el.dataset.a]=v==null?1:v;commit();},
 examDate:function(el){S.set.examDate=el.value;commit();},
 targetNote:function(el){S.set.targetNote=el.value;commit(true);},
 goalH:function(el){var v=num(el.value,1,60);if(v)S.set.goalH=v;commit();},
 goalQ:function(el){var v=num(el.value,5,1000);if(v)S.set.goalQ=Math.round(v);commit();},
 goalDone:function(el){var g=S.goals.filter(function(x){return x.i===el.dataset.id;})[0];if(g){g.done=el.checked?1:0;commit();}},
 errArea:function(el){ui.errA=el.value;var f=el.closest("form");ui.errO=f?f.elements.o.value:"";var dl=$("#dlErr");if(dl)dl.innerHTML=SYL[el.value].map(function(x){return '<option value="'+esc(x)+'">';}).join("");},
 essSum:function(el){var f=el.closest("form"),tot=0;for(var i=0;i<5;i++)tot+=+f.elements["c"+i].value;$("#essTot").textContent=tot;},
 corFiles:function(el){
  var c=ui.cor,lim=ui.imgLim,max=Math.min((lim&&lim.maxCount)||3,3),fl=Array.prototype.slice.call(el.files||[]);c.err="";
  fl.forEach(function(f){
   if(c.files.length>=max){c.err="Você pode enviar até "+max+" fotos.";return;}
   if(lim&&lim.maxInputBytes&&f.size>lim.maxInputBytes){c.err="Uma das fotos é grande demais (máximo de "+Math.floor(lim.maxInputBytes/1048576)+" MB).";return;}
   try{c.urls.push(URL.createObjectURL(f));c.files.push(f);}catch(e){c.err="Não consegui abrir essa foto.";}
  });
  try{el.value="";}catch(e){}render();
 },
 corPast:function(el){ui.cor.past=+el.value;},
 corOk:function(el){ui.cor.ok=!!el.checked;render();},
 corCareful:function(el){ui.cor.careful=!!el.checked;},

 objSet:function(el){var k=el.dataset.k,v=String(el.value).trim().slice(0,80);if(k==="year")v=v.replace(/[^0-9]/g,"").slice(0,4);S.set[k]=v;commit(true);},
 egComp:function(el){S.set.eg.c[+el.dataset.i]=+el.value;commit();},
 egTot:function(el){var v=num(el.value,0,1000);S.set.eg.t=v==null?null:Math.round(v);commit();}
};
var app=$("#app");
app.addEventListener("click",function(e){var el=e.target.closest("[data-act]");if(!el||el.tagName==="DETAILS"&&!e.target.closest("summary"))return;if(act[el.dataset.act]&&el.tagName!=="FORM")act[el.dataset.act](el,e);});
app.addEventListener("submit",function(e){e.preventDefault();var f=e.target;if(f.dataset.submit&&act[f.dataset.submit])act[f.dataset.submit](f);});
app.addEventListener("change",function(e){var el=e.target.closest("[data-change]");if(el&&chg[el.dataset.change])chg[el.dataset.change](el);});
app.addEventListener("input",function(e){var el=e.target;if(!el.dataset||!el.dataset.in)return;if(el.dataset.in==="tTopic")T.topic=el.value;else if(el.dataset.in==="bkIn")ui.bkText=el.value;else if(el.dataset.in==="corText"){ui.cor.text=el.value;var k=$("#corCount");if(k)k.textContent=wc(el.value)+" palavras";}else if(el.dataset.in==="corFree")ui.cor.free=el.value;else if(el.dataset.in==="corRev")ui.cor.rev=el.value;else if(el.dataset.in==="corExtIn")ui.cor.extIn=el.value;});

/* ------------------------------------------------------------------ tema e início */
function dark(){var t=document.documentElement.dataset.theme;return t?t==="dark":window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;}
try{var th=localStorage.getItem("rota-theme");if(th)document.documentElement.dataset.theme=th;}catch(e){}
$("#themeBtn").addEventListener("click",function(){var n=dark()?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("rota-theme",n);}catch(e){}});
window.addEventListener("hashchange",route);
setStatus("local");route();initDb();initSample();
})();
